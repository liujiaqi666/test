name: Build DJL Tokenizers GLIBC 2.28

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Rocky Linux 8 = GLIBC 2.28
    container:
      image: rockylinux:8

    steps:

      # ============================================================
      # 1. 安装编译依赖 
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          dnf install -y \
            git \
            gcc \
            gcc-c++ \
            make \
            cmake \
            curl \
            unzip \
            zip \
            openssl-devel \
            pkgconf-pkg-config \
            java-17-openjdk-devel \
            findutils \
            binutils \
            file \
            which

          echo "========================================"
          echo "GLIBC VERSION"
          echo "========================================"

          ldd --version | sed -n '1p'

          echo "========================================"
          echo "GCC VERSION"
          echo "========================================"

          gcc --version | sed -n '1p'

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"

          echo "JAVA_HOME=$JAVA_HOME"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version


      # ============================================================
      # 2. 安装 Rust
      # ============================================================
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs \
            | sh -s -- \
            -y \
            --profile minimal

          source "$HOME/.cargo/env"

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          echo "========================================"
          echo "RUST VERSION"
          echo "========================================"

          rustc --version
          cargo --version


      # ============================================================
      # 3. 下载 DJL 0.35.0
      # ============================================================
      - name: Clone DJL 0.35.0
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch v0.35.0 \
            --depth 1 \
            https://github.com/deepjavalibrary/djl.git \
            /djl

          cd /djl

          echo "========================================"
          echo "DJL VERSION"
          echo "========================================"

          git describe --tags


      # ============================================================
      # 4. 显示最终编译环境
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set -euxo pipefail

          source "$HOME/.cargo/env"

          echo "========================================"
          echo "GLIBC"
          echo "========================================"

          ldd --version | sed -n '1p'

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

          echo "========================================"
          echo "RUST"
          echo "========================================"

          rustc --version
          cargo --version

          echo "========================================"
          echo "GCC"
          echo "========================================"

          gcc --version | sed -n '1p'


      # ============================================================
      # 5. 编译 DJL Tokenizers JNI
      # ============================================================
      - name: Build tokenizer JNI
        shell: bash
        run: |
          set -euxo pipefail

          source "$HOME/.cargo/env"

          cd /djl

          chmod +x gradlew

          echo "========================================"
          echo "START BUILD TOKENIZER JNI"
          echo "========================================"

          ./gradlew :extensions:tokenizers:compileJNI

          echo "========================================"
          echo "BUILD FINISHED"
          echo "========================================"


      # ============================================================
      # 6. 查找生成的 libtokenizers.so
      # ============================================================
      - name: Find libtokenizers
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "SEARCH libtokenizers.so"
          echo "========================================"

          find /djl \
            -type f \
            -name 'libtokenizers.so' \
            -print

          SO_FILE="$(find /djl \
            -type f \
            -name 'libtokenizers.so' \
            -print -quit)"

          if [ -z "$SO_FILE" ]; then

            echo "========================================"
            echo "ERROR"
            echo "libtokenizers.so NOT FOUND"
            echo "========================================"

            exit 1

          fi

          echo "========================================"
          echo "FOUND"
          echo "========================================"

          echo "$SO_FILE"

          echo "SO_FILE=$SO_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 7. 查看 SO 基本信息
      # ============================================================
      - name: Inspect libtokenizers
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FILE"
          echo "========================================"

          file "$SO_FILE"

          echo
          echo "========================================"
          echo "SIZE"
          echo "========================================"

          ls -lh "$SO_FILE"

          echo
          echo "========================================"
          echo "LDD"
          echo "========================================"

          ldd "$SO_FILE" || true


      # ============================================================
      # 8. 检查 GLIBC 依赖
      # ============================================================
      - name: Check required GLIBC
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "REQUIRED GLIBC"
          echo "========================================"

          strings "$SO_FILE" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tee /tmp/glibc-versions.txt

          echo
          echo "========================================"
          echo "HIGHEST REQUIRED GLIBC"
          echo "========================================"

          HIGHEST="$(
            sed 's/GLIBC_//' /tmp/glibc-versions.txt \
              | sort -Vu \
              | tail -1
          )"

          echo "GLIBC_$HIGHEST"

          echo "HIGHEST_GLIBC=$HIGHEST" >> "$GITHUB_ENV"


      # ============================================================
      # 9. 强制验证 <= GLIBC 2.28
      # ============================================================
      - name: Verify GLIBC 2.28 compatibility
        shell: bash
        run: |
          set -euxo pipefail

          echo "Target server GLIBC = 2.28"
          echo "Library requires     = $HIGHEST_GLIBC"

          if [ "$(printf '%s\n' "$HIGHEST_GLIBC" "2.28" | sort -V | tail -1)" = "2.28" ]; then

            echo
            echo "========================================"
            echo "SUCCESS"
            echo "========================================"
            echo "libtokenizers.so requires:"
            echo "GLIBC_$HIGHEST_GLIBC"
            echo
            echo "Compatible with GLIBC 2.28"

          else

            echo
            echo "========================================"
            echo "FAILED"
            echo "========================================"
            echo "libtokenizers.so requires:"
            echo "GLIBC_$HIGHEST_GLIBC"
            echo
            echo "Target server only has:"
            echo "GLIBC_2.28"

            exit 1

          fi


      # ============================================================
      # 10. 准备 Artifact
      # ============================================================
      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /output

          cp "$SO_FILE" \
            /output/libtokenizers.so

          sha256sum \
            /output/libtokenizers.so \
            > /output/libtokenizers.so.sha256

          ldd --version \
            | sed -n '1p' \
            > /output/build-glibc.txt

          strings "$SO_FILE" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            > /output/required-glibc.txt

          echo "DJL Java version: 0.35.0" \
            > /output/build-info.txt

          echo "Target GLIBC: <= 2.28" \
            >> /output/build-info.txt

          echo "Architecture: x86_64" \
            >> /output/build-info.txt

          echo
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          ls -lh /output

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat /output/libtokenizers.so.sha256

          echo
          echo "========================================"
          echo "BUILD GLIBC"
          echo "========================================"

          cat /output/build-glibc.txt

          echo
          echo "========================================"
          echo "REQUIRED GLIBC"
          echo "========================================"

          cat /output/required-glibc.txt


      # ============================================================
      # 11. 上传 Artifact
      # ============================================================
      - name: Upload libtokenizers
        uses: actions/upload-artifact@v4
        with:
          name: libtokenizers-djl-0350-glibc228
          path: /output/
          retention-days: 7
          if-no-files-found: error
