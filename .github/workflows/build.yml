name: Build DJL Tokenizers GLIBC 2.28

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Rocky Linux 8 使用 GLIBC 2.28
    container:
      image: rockylinux:8

    steps:

      # ============================================================
      # 1. 安装编译环境
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          dnf install -y \
            git \
            gcc \
            gcc-c++ \
            make \
            cmake \
            curl \
            unzip \
            zip \
            openssl-devel \
            pkgconf-pkg-config \
            java-17-openjdk-devel \
            findutils \
            binutils \
            file \
            which

          echo "========================================"
          echo "GLIBC VERSION"
          echo "========================================"
          ldd --version | head -1

          echo "========================================"
          echo "GCC VERSION"
          echo "========================================"
          gcc --version | head -1

          echo "========================================"
          echo "JAVA LOCATION"
          echo "========================================"

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"

          echo "JAVA_HOME=$JAVA_HOME"

          # 给后续 GitHub Actions Step 使用
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version


      # ============================================================
      # 2. 安装 Rust
      # ============================================================
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          curl --proto '=https' \
               --tlsv1.2 \
               -sSf \
               https://sh.rustup.rs \
               | sh -s -- -y --profile minimal

          source "$HOME/.cargo/env"

          echo "========================================"
          echo "RUST VERSION"
          echo "========================================"

          rustc --version
          cargo --version

          # 后续 Step 也可以直接找到 cargo
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 3. 下载 DJL 0.35.0 源码
      # ============================================================
      - name: Clone DJL 0.35.0
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch v0.35.0 \
            --depth 1 \
            https://github.com/deepjavalibrary/djl.git \
            /djl

          cd /djl

          echo "========================================"
          echo "DJL VERSION"
          echo "========================================"

          git describe --tags


      # ============================================================
      # 4. 编译 Tokenizers JNI
      # ============================================================
      - name: Build tokenizer JNI
        shell: bash
        run: |
          set -euxo pipefail

          source "$HOME/.cargo/env"

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version
          rustc --version
          cargo --version

          echo "GLIBC:"
          ldd --version | head -1

          cd /djl

          chmod +x gradlew

          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          ./gradlew :extensions:tokenizers:compileJNI


      # ============================================================
      # 5. 找到生成的 libtokenizers.so
      # ============================================================
      - name: Find libtokenizers
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "SEARCH libtokenizers.so"
          echo "========================================"

          find /djl \
            -type f \
            -name 'libtokenizers.so' \
            -print

          SO_FILE="$(find /djl \
            -type f \
            -name 'libtokenizers.so' \
            | head -1)"

          if [ -z "$SO_FILE" ]; then
            echo "ERROR: libtokenizers.so NOT FOUND"
            exit 1
          fi

          echo "FOUND:"
          echo "$SO_FILE"

          echo "SO_FILE=$SO_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. 检查 SO 文件
      # ============================================================
      - name: Verify libtokenizers
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "LIBRARY FILE"
          echo "========================================"

          file "$SO_FILE"

          echo
          echo "========================================"
          echo "LDD"
          echo "========================================"

          ldd "$SO_FILE" || true

          echo
          echo "========================================"
          echo "REQUIRED GLIBC VERSIONS"
          echo "========================================"

          strings "$SO_FILE" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tee /tmp/glibc-versions.txt

          echo
          echo "========================================"
          echo "HIGHEST REQUIRED GLIBC"
          echo "========================================"

          tail -1 /tmp/glibc-versions.txt


      # ============================================================
      # 7. 自动验证不能依赖 GLIBC > 2.28
      # ============================================================
      - name: Check GLIBC compatibility
        shell: bash
        run: |
          set -euxo pipefail

          HIGHEST="$(
            strings "$SO_FILE" \
              | grep -o 'GLIBC_[0-9.]*' \
              | sed 's/GLIBC_//' \
              | sort -Vu \
              | tail -1
          )"

          echo "Highest required GLIBC = $HIGHEST"

          # 只允许 <= 2.28
          if printf '%s\n%s\n' "2.28" "$HIGHEST" \
              | sort -V -C; then

            echo "========================================"
            echo "SUCCESS"
            echo "libtokenizers.so is compatible"
            echo "Required GLIBC <= 2.28"
            echo "========================================"

          else

            echo "========================================"
            echo "ERROR"
            echo "libtokenizers.so requires GLIBC $HIGHEST"
            echo "Target server only has GLIBC 2.28"
            echo "========================================"

            exit 1

          fi


      # ============================================================
      # 8. 准备输出文件
      # ============================================================
      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /output

          cp "$SO_FILE" \
             /output/libtokenizers.so

          sha256sum \
             /output/libtokenizers.so \
             > /output/libtokenizers.so.sha256

          ldd --version \
             | head -1 \
             > /output/build-glibc.txt

          strings "$SO_FILE" \
             | grep -o 'GLIBC_[0-9.]*' \
             | sort -Vu \
             > /output/required-glibc.txt

          echo "========================================"
          echo "OUTPUT"
          echo "========================================"

          ls -lh /output/

          echo
          echo "SHA256:"
          cat /output/libtokenizers.so.sha256

          echo
          echo "BUILD GLIBC:"
          cat /output/build-glibc.txt

          echo
          echo "REQUIRED GLIBC:"
          cat /output/required-glibc.txt


      # ============================================================
      # 9. 上传 Artifact
      # ============================================================
      - name: Upload libtokenizers
        uses: actions/upload-artifact@v4
        with:
          name: libtokenizers-djl-0350-glibc228
          path: /output/
          retention-days: 7
